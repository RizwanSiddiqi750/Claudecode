<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Automation Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0b5f7f;
            --accent: #d97706;
            --success: #16a34a;
            --critical: #dc2626;
            --bg: #f9f8f6;
            --text: #1f2937;
            --border: #e5e7eb;
            --surface: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrapper {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
        }

        .logo { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 24px; }
        .nav-label { font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: 0.6; margin: 16px 0 8px; }
        .nav-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 6px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            text-align: left;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: var(--bg); border-color: var(--border); }
        .nav-btn.active { background: var(--primary); color: white; }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title { font-size: 18px; font-weight: 600; }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel-title { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
        .section-title { font-size: 14px; font-weight: 600; margin: 16px 0 8px; }

        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 12px; font-weight: 600; margin-bottom: 6px; display: block; }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
        }
        .form-textarea { min-height: 80px; resize: vertical; }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding: 8px;
            background: var(--bg);
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .agent-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-size: 12px;
            transition: all 0.2s;
        }
        .agent-checkbox:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .btn {
            padding: 10px 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }

        .output-item {
            background: var(--bg);
            border-left: 4px solid var(--accent);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .output-agent { font-weight: 600; color: var(--primary); font-size: 13px; margin-bottom: 4px; }
        .output-content { font-size: 12px; opacity: 0.8; white-space: pre-wrap; margin-bottom: 10px; }

        .output-actions { display: flex; gap: 8px; }
        .btn-small { flex: 1; padding: 6px 12px; font-size: 11px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-approve { background: var(--success); color: white; }
        .btn-reject { background: var(--critical); color: white; }

        .client-panel {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .client-name { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
        .client-info { font-size: 12px; opacity: 0.9; margin-bottom: 2px; }

        .action-btn {
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 6px;
            margin-right: 6px;
            transition: all 0.2s;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .metric-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .metric-value { font-size: 24px; font-weight: 700; color: var(--primary); }
        .metric-label { font-size: 11px; opacity: 0.7; margin-top: 4px; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo">🚀 Agent Hub</div>

            <div class="nav-label">Dashboard</div>
            <button class="nav-btn active" onclick="showView('dashboard')">📊 Overview</button>
            <button class="nav-btn" onclick="showView('execution')">⚙️ Execution</button>
            <button class="nav-btn" onclick="showView('approvals')">✅ Approvals</button>
            <button class="nav-btn" onclick="showView('clients')">👥 Clients</button>
        </div>

        <!-- MAIN -->
        <div class="main">
            <div class="header">
                <div class="header-title">Business Automation Hub</div>
                <div>● Ready</div>
            </div>

            <div class="content" id="content">
                <!-- CONTENT LOADS HERE -->
            </div>
        </div>
    </div>

    <script>
        // STATE
        let agents = generateAgents();
        let tasks = [];
        let outputs = [];
        let clients = [];
        let selectedAgents = new Set();
        let selectedClient = null;
        let currentView = 'dashboard';

        function generateAgents() {
            return [
                { id: 'a1', name: 'Lead Gen Agent' },
                { id: 'a2', name: 'Qualifier Agent' },
                { id: 'a3', name: 'Pitch Agent' },
                { id: 'a4', name: 'Proposal Agent' },
                { id: 'a5', name: 'Objection Agent' },
                { id: 'a6', name: 'Closer Agent' },
                { id: 'a7', name: 'Content Agent' },
                { id: 'a8', name: 'Email Agent' },
                { id: 'a9', name: 'Social Agent' },
                { id: 'a10', name: 'Analytics Agent' }
            ];
        }

        function showView(view) {
            currentView = view;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderContent();
        }

        function renderContent() {
            const content = document.getElementById('content');
            let html = '';

            if (currentView === 'dashboard') {
                html = `
                    <div class="panel">
                        <div class="panel-title">📊 Performance Metrics</div>
                        <div class="metrics-grid">
                            <div class="metric-card">
                                <div class="metric-value">${tasks.length}</div>
                                <div class="metric-label">Total Tasks</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value">${tasks.filter(t => t.status === 'completed').length}</div>
                                <div class="metric-label">Completed</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value">${outputs.filter(o => o.status === 'approved').length}</div>
                                <div class="metric-label">Approved</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value">${outputs.filter(o => o.status === 'pending').length}</div>
                                <div class="metric-label">Pending</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (currentView === 'execution') {
                html = `
                    <div class="panel">
                        <div class="panel-title">⚙️ Task Execution</div>

                        <div class="form-group">
                            <label class="form-label">Task Name</label>
                            <input type="text" class="form-input" id="taskName" placeholder="Task name">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea class="form-textarea" id="taskDesc" placeholder="Task description"></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Select Client</label>
                            <select class="form-select" id="clientSelect">
                                <option value="">-- No Client --</option>
                                ${clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                            </select>
                        </div>

                        <div class="section-title">Agents (${selectedAgents.size})</div>
                        <div class="agent-grid">
                            ${agents.map(a => `
                                <label class="agent-checkbox">
                                    <input type="checkbox" value="${a.id}" ${selectedAgents.has(a.id) ? 'checked' : ''} onchange="toggleAgent('${a.id}')">
                                    <span>${a.name}</span>
                                </label>
                            `).join('')}
                        </div>

                        <button class="btn" onclick="executeTask()" style="margin-top: 16px;">▶️ Execute</button>
                    </div>
                `;
            }
            else if (currentView === 'approvals') {
                const pending = outputs.filter(o => o.status === 'pending');
                const approved = outputs.filter(o => o.status === 'approved');

                html = `
                    <div class="panel">
                        <div class="panel-title">✅ Pending Approvals (${pending.length})</div>
                        ${pending.length === 0 ? '<p style="opacity: 0.6;">No pending approvals</p>' : ''}
                        ${pending.map(o => {
                            const task = tasks.find(t => t.id === o.taskId);
                            const client = task && clients.find(c => c.id === task.clientId);
                            return `
                                ${client ? `
                                    <div class="client-panel">
                                        <div class="client-name">${client.name}</div>
                                        <div class="client-info">🏢 ${client.company} | 💼 ${client.designation}</div>
                                        <div class="client-info">📧 ${client.email} | 📱 ${client.phone}</div>
                                        <div class="client-info">📦 ${client.products}</div>
                                        <a class="action-btn" href="tel:${client.phone}">📞 Call</a>
                                        <a class="action-btn" href="mailto:${client.email}">📧 Email</a>
                                        <a class="action-btn" href="https://wa.me/${client.phone.replace(/[^0-9]/g, '')}" target="_blank">💬 WhatsApp</a>
                                        <a class="action-btn" href="https://www.linkedin.com/search/results/people/?keywords=${client.name}" target="_blank">🔗 LinkedIn</a>
                                    </div>
                                ` : '<div style="background: #fee2e2; padding: 8px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; color: #991b1b;">⚠️ No Client Linked</div>'}
                                <div class="output-item">
                                    <div class="output-agent">🤖 ${o.agent}</div>
                                    <div class="output-content">${o.content}</div>
                                    <div class="output-actions">
                                        <button class="btn-small btn-approve" onclick="approveOutput('${o.id}')">✓ Approve</button>
                                        <button class="btn-small btn-reject" onclick="rejectOutput('${o.id}')">✗ Reject</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="panel">
                        <div class="panel-title">✓ Approved (${approved.length})</div>
                        ${approved.map(o => {
                            const task = tasks.find(t => t.id === o.taskId);
                            const client = task && clients.find(c => c.id === task.clientId);
                            return `
                                ${client ? `
                                    <div style="font-size: 11px; margin-bottom: 8px; padding: 8px; background: var(--bg); border-radius: 4px;">
                                        <strong style="color: var(--primary);">👤 ${client.name}</strong><br>
                                        🏢 ${client.company} | 💼 ${client.designation}<br>
                                        📧 ${client.email} | 📱 ${client.phone}
                                    </div>
                                ` : ''}
                                <div class="output-item">
                                    <div class="output-agent">🤖 ${o.agent}</div>
                                    <div class="output-content">${o.content.substring(0, 80)}...</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
            else if (currentView === 'clients') {
                html = `
                    <div class="panel">
                        <div class="panel-title">👥 Clients</div>

                        <div class="section-title">Add New Client</div>
                        <div class="form-group">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-input" id="clientName" placeholder="Client name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Company</label>
                            <input type="text" class="form-input" id="clientCompany" placeholder="Company">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Designation</label>
                            <input type="text" class="form-input" id="clientDesignation" placeholder="CEO, Manager, etc">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Products/Services</label>
                            <input type="text" class="form-input" id="clientProducts" placeholder="Products">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-input" id="clientEmail" placeholder="email@company.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-input" id="clientPhone" placeholder="+1234567890">
                        </div>
                        <button class="btn" onclick="addClient()">➕ Add Client</button>

                        <div class="section-title">Saved Clients (${clients.length})</div>
                        ${clients.map(c => `
                            <div class="client-panel">
                                <div class="client-name">${c.name}</div>
                                <div class="client-info">🏢 ${c.company}</div>
                                <div class="client-info">💼 ${c.designation}</div>
                                <div class="client-info">📧 ${c.email} | 📱 ${c.phone}</div>
                                <div class="client-info">📦 ${c.products}</div>
                                <a class="action-btn" href="tel:${c.phone}">📞 Call</a>
                                <a class="action-btn" href="mailto:${c.email}">📧 Email</a>
                                <a class="action-btn" href="https://wa.me/${c.phone.replace(/[^0-9]/g, '')}" target="_blank">💬 WhatsApp</a>
                                <button class="btn-small" style="background: var(--critical); color: white; margin-top: 8px;" onclick="deleteClient('${c.id}')">🗑️ Delete</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        function toggleAgent(id) {
            if (selectedAgents.has(id)) {
                selectedAgents.delete(id);
            } else {
                selectedAgents.add(id);
            }
            renderContent();
        }

        function executeTask() {
            const name = document.getElementById('taskName').value;
            const desc = document.getElementById('taskDesc').value;
            const clientId = document.getElementById('clientSelect').value;

            if (!name || selectedAgents.size === 0) {
                alert('Enter task name and select agents');
                return;
            }

            const task = {
                id: `task-${Date.now()}`,
                name,
                description: desc,
                clientId: clientId || null,
                agents: Array.from(selectedAgents),
                status: 'running'
            };

            tasks.push(task);

            // Generate outputs
            setTimeout(() => {
                Array.from(selectedAgents).forEach(agentId => {
                    const agent = agents.find(a => a.id === agentId);
                    outputs.push({
                        id: `out-${Date.now()}-${Math.random()}`,
                        taskId: task.id,
                        agent: agent.name,
                        content: `Output from ${agent.name} for "${name}"`,
                        status: 'pending'
                    });
                });
                task.status = 'completed';
                renderContent();
            }, 1000);

            document.getElementById('taskName').value = '';
            document.getElementById('taskDesc').value = '';
            selectedAgents.clear();
            renderContent();
        }

        function addClient() {
            const name = document.getElementById('clientName').value;
            const company = document.getElementById('clientCompany').value;
            const designation = document.getElementById('clientDesignation').value;
            const products = document.getElementById('clientProducts').value;
            const email = document.getElementById('clientEmail').value;
            const phone = document.getElementById('clientPhone').value;

            if (!name || !email || !phone) {
                alert('Fill Name, Email, Phone');
                return;
            }

            clients.push({
                id: `client-${Date.now()}`,
                name, company, designation, products, email, phone
            });

            document.getElementById('clientName').value = '';
            document.getElementById('clientCompany').value = '';
            document.getElementById('clientDesignation').value = '';
            document.getElementById('clientProducts').value = '';
            document.getElementById('clientEmail').value = '';
            document.getElementById('clientPhone').value = '';

            renderContent();
        }

        function deleteClient(id) {
            clients = clients.filter(c => c.id !== id);
            renderContent();
        }

        function approveOutput(id) {
            const output = outputs.find(o => o.id === id);
            if (output) {
                output.status = 'approved';
                renderContent();
            }
        }

        function rejectOutput(id) {
            const output = outputs.find(o => o.id === id);
            if (output) {
                output.status = 'rejected';
                renderContent();
            }
        }

        // INIT
        window.addEventListener('DOMContentLoaded', () => {
            renderContent();
        });
    </script>
</body>
</html>
