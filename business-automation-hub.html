<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Automation Hub - Dynamic Agent Platform</title>
    <style>
        :root {
            --primary: #0b5f7f;
            --accent: #d97706;
            --success: #16a34a;
            --critical: #dc2626;
            --attention: #f59e0b;
            --bg-light: #f9f8f6;
            --bg-dark: #0d1117;
            --text-light: #1f2937;
            --text-dark: #f3f4f6;
            --border-light: #e5e7eb;
            --border-dark: #374151;
            --surface-light: #ffffff;
            --surface-dark: #1f2937;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: var(--bg-dark);
                --text: var(--text-dark);
                --border: var(--border-dark);
                --surface: var(--surface-dark);
            }
        }

        :root[data-theme="light"] {
            --bg: var(--bg-light);
            --text: var(--text-light);
            --border: var(--border-light);
            --surface: var(--surface-light);
        }

        :root[data-theme="dark"] {
            --bg: var(--bg-dark);
            --text: var(--text-dark);
            --border: var(--border-dark);
            --surface: var(--surface-dark);
        }

        :root {
            --bg: var(--bg-light);
            --text: var(--text-light);
            --border: var(--border-light);
            --surface: var(--surface-light);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .wrapper {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
            gap: 0;
        }

        /* SIDEBAR */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text);
            opacity: 0.6;
            margin-bottom: 8px;
        }

        .nav-btn {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            text-align: left;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--bg);
            border-color: var(--border);
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .theme-selector {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .theme-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 8px;
        }

        .theme-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .theme-btn {
            padding: 8px 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* MAIN CONTENT */
        .main {
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--bg);
        }

        /* CONTENT AREA */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .module-header {
            margin-bottom: 24px;
        }

        .module-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .module-description {
            font-size: 14px;
            opacity: 0.7;
        }

        /* AGENT DISCOVERY */
        .agent-discovery {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .discovery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .discovery-title {
            font-size: 16px;
            font-weight: 600;
        }

        .agent-count {
            font-size: 13px;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .search-container {
            margin-bottom: 16px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }

        .search-input::placeholder {
            opacity: 0.5;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tag-btn {
            padding: 6px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
        }

        .tag-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 12px;
            background: var(--bg);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .agent-card {
            padding: 12px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .agent-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .agent-card.selected {
            border-color: var(--primary);
            background: rgba(11, 95, 127, 0.1);
        }

        .agent-name {
            font-weight: 600;
            font-size: 13px;
        }

        .agent-category {
            font-size: 11px;
            opacity: 0.6;
            text-transform: uppercase;
        }

        .agent-description {
            font-size: 12px;
            opacity: 0.7;
            line-height: 1.4;
        }

        .agent-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            margin-top: auto;
        }

        /* SELECTED AGENTS */
        .selected-agents {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .selected-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .selected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .agent-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .agent-tag .remove {
            cursor: pointer;
            font-weight: bold;
            margin-left: 4px;
        }

        /* MODULE CONTENT */
        .module-form {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .console-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
        }

        .console-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .console-clear {
            font-size: 11px;
            background: transparent;
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .console {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.4;
        }

        .console-line {
            margin-bottom: 4px;
            padding: 4px 0;
            border-left: 2px solid transparent;
            padding-left: 8px;
        }

        .console-line.info {
            color: var(--primary);
            border-left-color: var(--primary);
        }

        .console-line.success {
            color: var(--success);
            border-left-color: var(--success);
        }

        .console-line.error {
            color: var(--critical);
            border-left-color: var(--critical);
        }

        .console-line.warning {
            color: var(--attention);
            border-left-color: var(--attention);
        }

        .console-timestamp {
            opacity: 0.5;
            font-size: 11px;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .wrapper {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }
        }

        .loading {
            text-align: center;
            padding: 24px;
            opacity: 0.7;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* OUTPUT PANEL */
        .output-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
            max-height: 500px;
            overflow-y: auto;
        }

        .output-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-count {
            font-size: 12px;
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .outputs-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .output-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .output-item.approved {
            border-left: 4px solid var(--success);
            background: rgba(22, 163, 74, 0.05);
        }

        .output-item.rejected {
            border-left: 4px solid var(--critical);
            background: rgba(220, 38, 38, 0.05);
        }

        .output-item.pending {
            border-left: 4px solid var(--attention);
        }

        .output-meta {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
        }

        .output-agent {
            font-weight: 600;
            color: var(--primary);
            font-size: 13px;
        }

        .output-timestamp {
            font-size: 11px;
            opacity: 0.6;
        }

        .output-status {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--attention);
        }

        .status-approved {
            background: rgba(22, 163, 74, 0.2);
            color: var(--success);
        }

        .status-rejected {
            background: rgba(220, 38, 38, 0.2);
            color: var(--critical);
        }

        .output-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-size: 13px;
            line-height: 1.5;
            max-height: 150px;
            overflow-y: auto;
        }

        .output-task {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .output-actions {
            display: flex;
            gap: 8px;
        }

        .btn-approve,
        .btn-reject {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-approve {
            background: var(--success);
            color: white;
        }

        .btn-approve:hover:not(:disabled) {
            opacity: 0.9;
        }

        .btn-reject {
            background: var(--critical);
            color: white;
        }

        .btn-reject:hover:not(:disabled) {
            opacity: 0.9;
        }

        .btn-approve:disabled,
        .btn-reject:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .output-empty {
            text-align: center;
            padding: 24px;
            opacity: 0.6;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo">🤖 Automation Hub</div>

            <div class="nav-section">
                <div class="nav-label">Modules</div>
                <button class="nav-btn active" onclick="switchModule('agents')">🤖 AI Agents</button>
                <button class="nav-btn" onclick="switchModule('website')">🌐 Website Builder</button>
                <button class="nav-btn" onclick="switchModule('social')">📱 Social Media</button>
                <button class="nav-btn" onclick="switchModule('brand')">🎨 Brand Tools</button>
                <button class="nav-btn" onclick="switchModule('email')">✉️ Email Campaigns</button>
            </div>

            <div class="nav-section">
                <div class="nav-label">Tools</div>
                <button class="nav-btn btn-secondary" onclick="exportConfig()">📥 Export</button>
                <button class="nav-btn btn-secondary" onclick="importConfig()">📤 Import</button>
            </div>

            <div class="theme-selector">
                <div class="theme-label">Theme</div>
                <div class="theme-buttons">
                    <button class="theme-btn active" onclick="setTheme('light')">☀️</button>
                    <button class="theme-btn" onclick="setTheme('dark')">🌙</button>
                    <button class="theme-btn" onclick="setTheme('auto')">🔄</button>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main">
            <div class="header">
                <div class="header-title" id="headerTitle">AI Agents Discovery</div>
                <div class="header-controls">
                    <button class="btn" onclick="executeCurrent()">▶ Execute</button>
                </div>
            </div>

            <div class="content" id="content">
                <!-- Dynamic content loaded here -->
            </div>

            <!-- OUTPUT APPROVAL PANEL -->
            <div class="output-panel" id="outputPanel" style="display: none;">
                <div class="output-header">
                    <span>Agent Outputs</span>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span class="output-count" id="outputCount">0</span>
                        <button class="console-clear" onclick="clearOutputs()">Clear</button>
                    </div>
                </div>
                <div class="outputs-list" id="outputsList">
                    <div class="output-empty">No outputs yet. Run agents to see results here.</div>
                </div>
            </div>

            <!-- CONSOLE -->
            <div class="console-section">
                <div class="console-header">
                    <span>Execution Console</span>
                    <button class="console-clear" onclick="clearConsole()">Clear</button>
                </div>
                <div class="console" id="console"></div>
            </div>
        </div>
    </div>

    <script>
        // Global State
        let agents = [];
        let selectedAgents = new Set();
        let currentModule = 'agents';
        let allAgents = [];
        let filteredAgents = [];
        let currentFilter = '';
        let outputs = [];

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            discoverAgents();
            renderModule();
            restoreOutputs();
        });

        // Output Management
        function addOutput(agentId, agentName, task, content) {
            const output = {
                id: `output-${Date.now()}-${Math.random()}`,
                agentId,
                agentName,
                task,
                content,
                status: 'pending',
                timestamp: new Date().toLocaleTimeString(),
                createdAt: Date.now()
            };

            outputs.unshift(output);
            renderOutputs();
            saveOutputs();
            logConsole('Output', `${agentName} generated output (awaiting approval)`, 'info');

            if (outputs.length > 0) {
                document.getElementById('outputPanel').style.display = 'block';
            }
        }

        function approveOutput(outputId) {
            const output = outputs.find(o => o.id === outputId);
            if (output) {
                output.status = 'approved';
                renderOutputs();
                saveOutputs();
                logConsole('Approval', `${output.agentName} output APPROVED`, 'success');
            }
        }

        function rejectOutput(outputId) {
            const output = outputs.find(o => o.id === outputId);
            if (output) {
                output.status = 'rejected';
                renderOutputs();
                saveOutputs();
                logConsole('Approval', `${output.agentName} output REJECTED`, 'error');
            }
        }

        function renderOutputs() {
            const panel = document.getElementById('outputPanel');
            const list = document.getElementById('outputsList');
            const count = document.getElementById('outputCount');

            if (outputs.length === 0) {
                list.innerHTML = '<div class="output-empty">No outputs yet. Run agents to see results here.</div>';
                count.textContent = '0';
                return;
            }

            count.textContent = outputs.length;

            list.innerHTML = outputs.map(output => `
                <div class="output-item ${output.status}">
                    <div class="output-meta">
                        <div>
                            <div class="output-agent">🤖 ${output.agentName}</div>
                            <div class="output-timestamp">${output.timestamp}</div>
                        </div>
                        <span class="output-status status-${output.status}">${output.status}</span>
                    </div>
                    <div class="output-task">📋 Task: ${output.task}</div>
                    <div class="output-content">${output.content}</div>
                    ${output.status === 'pending' ? `
                        <div class="output-actions">
                            <button class="btn-approve" onclick="approveOutput('${output.id}')">✓ Approve</button>
                            <button class="btn-reject" onclick="rejectOutput('${output.id}')">✗ Reject</button>
                        </div>
                    ` : `
                        <div class="output-actions">
                            <button class="btn-approve" disabled>✓ Approved</button>
                        </div>
                    `}
                </div>
            `).join('');
        }

        function clearOutputs() {
            if (confirm('Clear all outputs?')) {
                outputs = [];
                renderOutputs();
                saveOutputs();
                logConsole('System', 'All outputs cleared', 'info');
                document.getElementById('outputPanel').style.display = 'none';
            }
        }

        function saveOutputs() {
            localStorage.setItem('outputs', JSON.stringify(outputs));
        }

        function restoreOutputs() {
            const saved = localStorage.getItem('outputs');
            if (saved) {
                try {
                    outputs = JSON.parse(saved);
                    renderOutputs();
                    if (outputs.length > 0) {
                        document.getElementById('outputPanel').style.display = 'block';
                    }
                } catch (e) {
                    console.error('Failed to restore outputs', e);
                }
            }
        }

        // Theme Management
        function loadTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            setTheme(saved);
        }

        function setTheme(theme) {
            if (theme === 'auto') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            localStorage.setItem('theme', theme);

            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[onclick="setTheme('${theme}')"]`)?.classList.add('active');
        }

        // Agent Discovery - Auto-discover from 21st.dev
        async function discoverAgents() {
            logConsole('System', 'Discovering agents from Agency Agents...', 'info');

            try {
                // Try to fetch from 21st.dev API
                const response = await fetch('https://21st.dev/api/agents', {
                    headers: { 'Accept': 'application/json' }
                }).catch(() => null);

                if (response?.ok) {
                    allAgents = await response.json();
                    logConsole('System', `Discovered ${allAgents.length} agents from API`, 'success');
                } else {
                    // Fallback: Load default comprehensive agent pool
                    allAgents = getDefaultAgents();
                    logConsole('System', `Loaded ${allAgents.length} default agents (API unavailable)`, 'warning');
                }
            } catch (error) {
                allAgents = getDefaultAgents();
                logConsole('System', `Loaded default agents (${allAgents.length} total)`, 'warning');
            }

            filteredAgents = [...allAgents];
            renderAgentDiscovery();
        }

        // Default agent pool if API unavailable
        function getDefaultAgents() {
            return [
                // Sales & Qualification
                { id: 'lead-gen', name: 'Lead Generator', category: 'Sales', description: 'Identifies and qualifies potential leads' },
                { id: 'qualifier', name: 'Lead Qualifier', category: 'Sales', description: 'Qualifies leads and scores potential' },
                { id: 'pitch', name: 'Sales Pitch', category: 'Sales', description: 'Crafts compelling sales pitches' },
                { id: 'proposal', name: 'Proposal Generator', category: 'Sales', description: 'Creates professional proposals' },

                // Marketing & Content
                { id: 'content', name: 'Content Creator', category: 'Marketing', description: 'Creates marketing content' },

                { id: 'strategist', name: 'Business Strategist', category: 'Strategy', description: 'Develops business strategy' },

                { id: 'competitor', name: 'Competitor Analyst', category: 'Strategy', description: 'Analyzes competitor activity' },
                { id: 'forecaster', name: 'Revenue Forecaster', category: 'Strategy', description: 'Forecasts revenue' },
            ];
        }

        // Render Agent Discovery Interface
        function renderAgentDiscovery() {
            const html = `
                <div class="module-header">
                    <div class="module-title">🤖 Agent Marketplace</div>
                    <div class="module-description">Select agents from your ${allAgents.length}+ agent pool to create custom workflows</div>
                </div>

                <div class="agent-discovery">
                    <div class="discovery-header">
                        <div class="discovery-title">Available Agents</div>
                        <div class="agent-count">${selectedAgents.size} / ${allAgents.length}</div>
                    </div>

                    <div class="search-container">
                        <input type="text" class="search-input" id="agentSearch" placeholder="Search agents..."
                               onkeyup="filterAgents(this.value)">
                    </div>

                    <div class="filter-tags" id="filterTags">
                        <button class="tag-btn active" onclick="filterByCategory('all')">All</button>
                    </div>

                    <div class="agents-grid" id="agentsGrid">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>

                <div class="selected-agents" id="selectedSection" style="display: none;">
                    <div class="selected-title">Selected Agents (${selectedAgents.size})</div>
                    <div class="selected-list" id="selectedList"></div>
                </div>

                <div class="module-form">
                    <div class="form-group">
                        <label class="form-label">Agency Name</label>
                        <input type="text" class="form-input" id="agencyName" placeholder="e.g., Growth Hackers Team">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Purpose</label>
                        <textarea class="form-textarea" id="agencyPurpose" placeholder="What will this agency do?"></textarea>
                    </div>
                    <button class="btn" onclick="createAgency()">Create Agency</button>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
            setupFilterTags();
            renderAgentCards();
        }

        // Setup filter tags
        function setupFilterTags() {
            const categories = new Set(allAgents.map(a => a.category));
            const container = document.getElementById('filterTags');

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn';
                btn.textContent = cat;
                btn.onclick = () => filterByCategory(cat);
                container.appendChild(btn);
            });
        }

        // Filter agents
        function filterAgents(search) {
            currentFilter = search.toLowerCase();
            renderAgentCards();
        }

        function filterByCategory(category) {
            document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                filteredAgents = [...allAgents];
            } else {
                filteredAgents = allAgents.filter(a => a.category === category);
            }
            renderAgentCards();
        }

        // Render agent cards
        function renderAgentCards() {
            const filtered = filteredAgents.filter(a =>
                a.name.toLowerCase().includes(currentFilter) ||
                a.description.toLowerCase().includes(currentFilter)
            );

            const grid = document.getElementById('agentsGrid');
            grid.innerHTML = filtered.map(agent => `
                <div class="agent-card ${selectedAgents.has(agent.id) ? 'selected' : ''}"
                     onclick="toggleAgent('${agent.id}')">
                    <div>
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-category">${agent.category}</div>
                        <div class="agent-description">${agent.description}</div>
                    </div>
                    <input type="checkbox" class="agent-checkbox" ${selectedAgents.has(agent.id) ? 'checked' : ''}>
                </div>
            `).join('');

            updateSelectedDisplay();
        }

        // Toggle agent selection
        function toggleAgent(agentId) {
            if (selectedAgents.has(agentId)) {
                selectedAgents.delete(agentId);
            } else {
                selectedAgents.add(agentId);
            }
            renderAgentCards();
        }

        // Update selected display
        function updateSelectedDisplay() {
            const section = document.getElementById('selectedSection');
            if (selectedAgents.size > 0) {
                section.style.display = 'block';
                const list = document.getElementById('selectedList');
                list.innerHTML = Array.from(selectedAgents).map(id => {
                    const agent = allAgents.find(a => a.id === id);
                    return `
                        <div class="agent-tag">
                            ${agent?.name || id}
                            <span class="remove" onclick="toggleAgent('${id}')">×</span>
                        </div>
                    `;
                }).join('');
            } else {
                section.style.display = 'none';
            }
        }

        // Create agency
        function createAgency() {
            const name = document.getElementById('agencyName').value;
            const purpose = document.getElementById('agencyPurpose').value;

            if (!name || selectedAgents.size === 0) {
                alert('Please name your agency and select at least one agent');
                return;
            }

            logConsole('Agency', `Created: ${name} (${selectedAgents.size} agents)`, 'success');
            logConsole('Agency', `Purpose: ${purpose}`, 'info');

            selectedAgents.forEach(agentId => {
                const agent = allAgents.find(a => a.id === agentId);
                logConsole('Agent', `Added: ${agent?.name}`, 'success');
            });

            // Reset form
            document.getElementById('agencyName').value = '';
            document.getElementById('agencyPurpose').value = '';
            selectedAgents.clear();
            renderAgentCards();
        }

        // Module Switching
        function switchModule(module) {
            currentModule = module;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[onclick="switchModule('${module}')"]`).classList.add('active');
            renderModule();
        }

        function renderModule() {
            const titles = {
                agents: '🤖 AI Agents Discovery',
                website: '🌐 Website Builder',
                social: '📱 Social Media Posts',
                brand: '🎨 Brand Tools',
                email: '✉️ Email Campaigns'
            };

            document.getElementById('headerTitle').textContent = titles[currentModule];

            if (currentModule === 'agents') {
                renderAgentDiscovery();
            } else {
                renderModuleForm();
            }
        }

        // Render module forms
        function renderModuleForm() {
            const forms = {
                website: `
                    <div class="module-header">
                        <div class="module-title">Website Builder</div>
                        <div class="module-description">Create and design websites with your selected agents</div>
                    </div>
                    <div class="module-form">
                        <div class="form-group">
                            <label class="form-label">Website Name</label>
                            <input type="text" class="form-input" placeholder="Your website title">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea class="form-textarea" placeholder="Website description"></textarea>
                        </div>
                        <button class="btn" onclick="executeWithAgents('website')">Generate Website</button>
                    </div>
                `,
                social: `
                    <div class="module-header">
                        <div class="module-title">Social Media Posts</div>
                        <div class="module-description">Generate content for multiple platforms</div>
                    </div>
                    <div class="module-form">
                        <div class="form-group">
                            <label class="form-label">Topic</label>
                            <input type="text" class="form-input" placeholder="What to post about?">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Platforms</label>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                                <label><input type="checkbox"> Twitter</label>
                                <label><input type="checkbox"> LinkedIn</label>
                                <label><input type="checkbox"> Instagram</label>
                                <label><input type="checkbox"> Facebook</label>
                            </div>
                        </div>
                        <button class="btn" onclick="executeWithAgents('social')">Generate Posts</button>
                    </div>
                `,
                brand: `
                    <div class="module-header">
                        <div class="module-title">Brand Tools</div>
                        <div class="module-description">Create brand assets and guidelines</div>
                    </div>
                    <div class="module-form">
                        <div class="form-group">
                            <label class="form-label">Brand Name</label>
                            <input type="text" class="form-input" placeholder="Your brand name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Brand Description</label>
                            <textarea class="form-textarea" placeholder="What does your brand do?"></textarea>
                        </div>
                        <button class="btn" onclick="executeWithAgents('brand')">Generate Brand Assets</button>
                    </div>
                `,
                email: `
                    <div class="module-header">
                        <div class="module-title">Email Campaigns</div>
                        <div class="module-description">Create and manage email campaigns</div>
                    </div>
                    <div class="module-form">
                        <div class="form-group">
                            <label class="form-label">Campaign Subject</label>
                            <input type="text" class="form-input" placeholder="Email subject line">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Campaign Message</label>
                            <textarea class="form-textarea" placeholder="Email body content"></textarea>
                        </div>
                        <button class="btn" onclick="executeWithAgents('email')">Create Campaign</button>
                    </div>
                `
            };

            document.getElementById('content').innerHTML = forms[currentModule] || '';
        }

        // Execute functions
        function executeCurrent() {
            if (currentModule === 'agents') {
                createAgency();
            } else {
                executeWithAgents(currentModule);
            }
        }

        function executeWithAgents(module) {
            if (selectedAgents.size === 0) {
                alert('Please select at least one agent from the Agent Marketplace first');
                switchModule('agents');
                return;
            }

            logConsole('Execution', `Running ${module} module with ${selectedAgents.size} agents`, 'info');

            let taskDescription = '';
            switch(module) {
                case 'website':
                    taskDescription = document.getElementById('agencyName')?.value || 'Website Creation';
                    break;
                case 'social':
                    taskDescription = document.querySelector('[placeholder="What to post about?"]')?.value || 'Social Media Content';
                    break;
                case 'brand':
                    taskDescription = document.querySelector('[placeholder="Your brand name"]')?.value || 'Brand Assets';
                    break;
                case 'email':
                    taskDescription = document.querySelector('[placeholder="Email subject line"]')?.value || 'Email Campaign';
                    break;
            }

            // Simulate agent execution with delays
            selectedAgents.forEach((agentId, index) => {
                const agent = allAgents.find(a => a.id === agentId);
                if (!agent) return;

                setTimeout(() => {
                    logConsole(agent.name, `Processing ${module} request...`, 'info');

                    // Generate realistic output based on agent type
                    const output = generateAgentOutput(agent, module, taskDescription);

                    // Add output after a short delay (simulating processing)
                    setTimeout(() => {
                        addOutput(agent.id, agent.name, taskDescription, output);
                    }, 500);
                }, index * 800);
            });
        }

        function generateAgentOutput(agent, module, task) {
            const outputs = {
                'Lead Gen': `✓ Identified 12 qualified leads\n• TechCorp Inc - Enterprise tier\n• StartupXYZ - Growth stage\n• MegaRetail Corp - Volume buyer\n\nTotal lead value: $450K ARR potential`,
                'Lead Qualifier': `✓ Qualification Score Report:\n• 8 leads qualified (Grade A)\n• 3 leads qualified (Grade B)\n• 1 lead rejected (low budget)\n\nConversion probability: 65%`,
                'Sales Pitch': `✓ Sales pitch generated:\n"Transform your operations with our proven automation solution. Companies like you save 300+ hours annually. Want to see a demo?"`,
                'Proposal Generator': `✓ Professional proposal created\n• Custom pricing: $45K/year\n• Implementation timeline: 2 weeks\n• ROI projection: 3.2x in first year\n• Includes 6-month support`,
                'Objection Handler': `✓ Objection handling script ready:\n\nObjection: "Too expensive"\nResponse: "Let's look at your time costs. At $75/hr, you'll break even in just 150 hours of saved work."`,
                'Deal Closer': `✓ Deal closure strategy:\n• Schedule follow-up: Tomorrow 2pm\n• Send contract: Tonight\n• Expected close date: Friday\n• Final incentive: 10% early-bird bonus`,
                'Content Creator': `✓ Blog post outline generated:\n1. Problem statement\n2. Your solution\n3. Case study example\n4. CTA section\n\nEstimated: 1200 words, 5-min read`,
                'Copywriter': `✓ Email copy variations created:\nSubject: "3 Ways [Company] Saves 300+ Hours (+ ROI Breakdown)"\nBody: Personalized, emotion-driven, benefit-focused`,
                'SEO Optimizer': `✓ SEO recommendations:\n• Add 8 target keywords\n• Improve meta descriptions\n• Restructure headers\n• Add internal links (12 opportunities)\n\nExpected ranking improvement: +25%`,
                'Social Media Manager': `✓ Social media post created:\n📱 Twitter: 140 chars, 3 hashtags\n📱 LinkedIn: Professional version\n📱 Instagram: Visual-first approach\n\nScheduled: Tomorrow 9am`,
                'Email Marketer': `✓ Email campaign ready:\n• Segment: 5,400 prospects\n• Send time: Optimal (Tuesday 10am)\n• Subject line A/B test ready\n• Estimated open rate: 28%`,
                'Workflow Optimizer': `✓ Process bottlenecks identified:\n• Step 3: 40% time waste\n• Integration gap: $2K/month cost\n• Recommendation: Automation here saves $24K/year`,
                'Task Scheduler': `✓ Workflow scheduled:\n• Task 1: Due tomorrow 9am\n• Task 2: Due in 3 days\n• Task 3: Due in 1 week\n• Dependencies configured`,
                'Data Analyst': `✓ Analytics report generated:\n• 23% conversion increase\n• $120K additional revenue\n• Customer acquisition cost: $340\n• Lifetime value: $8,900`
            };

            return outputs[agent.name] || `✓ ${agent.name} processed "${task}"\n\nOutput generated and ready for review.`;
        }

        // Console logging
        function logConsole(source, message, type = 'info') {
            const console = document.getElementById('console');
            const timestamp = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.innerHTML = `<span class="console-timestamp">${timestamp}</span> [${source}] ${message}`;
            console.appendChild(line);
            console.scrollTop = console.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }

        // Export/Import
        function exportConfig() {
            const config = {
                selectedAgents: Array.from(selectedAgents),
                allAgents: allAgents,
                outputs: outputs,
                timestamp: new Date().toISOString()
            };
            const json = JSON.stringify(config, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `automation-hub-${Date.now()}.json`;
            a.click();
            logConsole('Export', `Configuration exported (${outputs.length} outputs included)`, 'success');
        }

        function importConfig() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const config = JSON.parse(event.target.result);
                        selectedAgents = new Set(config.selectedAgents);
                        if (config.outputs) {
                            outputs = config.outputs;
                            renderOutputs();
                            if (outputs.length > 0) {
                                document.getElementById('outputPanel').style.display = 'block';
                            }
                        }
                        logConsole('Import', `Loaded ${selectedAgents.size} agents (${config.outputs?.length || 0} outputs)`, 'success');
                        renderAgentCards();
                    } catch (err) {
                        logConsole('Import', 'Failed to import configuration', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
    </script>
